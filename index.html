<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ron-1</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#10131a;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center}
main{width:min(720px,92%);background:#181d27;border-radius:22px;padding:24px;box-sizing:border-box;box-shadow:0 20px 60px #0008}
h1{margin:0 0 4px}.sub{color:#aab3c2;margin-bottom:20px}
#chat{height:48vh;overflow:auto;padding:8px}.m{padding:12px 15px;border-radius:15px;margin:10px 0;white-space:pre-wrap}.r{background:#252c39}.u{background:#303b50}
form{display:flex;gap:8px}input{flex:1;padding:14px;border:0;border-radius:14px;background:#252c39;color:#fff;font-size:16px}button{border:0;border-radius:14px;padding:0 20px;font-size:16px;cursor:pointer}
.note{text-align:center;color:#8993a3;font-size:13px;margin-top:12px}
</style>
</head>
<body>
<main>
<h1>🤖 Ron-1</h1><div class="sub">المساعد المستقل</div>
<div id="chat"><div class="m r">مرحبًا، أنا Ron-1. جاري الاتصال بعقل Qwen3-1.7B...</div></div>
<form><input id="msg" autocomplete="off" placeholder="اكتب رسالتك إلى رون..."><button id="send">إرسال</button></form>
<div class="note" id="status">خادم Ron-1: جاري التشغيل...</div>
</main>
<script type="module">
import { Client } from "https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js";
const chat=document.querySelector('#chat'),input=document.querySelector('#msg'),send=document.querySelector('#send'),status=document.querySelector('#status');
let app=null;
function add(cls,text){const d=document.createElement('div');d.className='m '+cls;d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d;}
async function connect(){
  status.textContent='الاتصال بخادم Ron-1...';
  app=await Client.connect('arkanws513/Ron-1-server',{status_callback:s=>{status.textContent='الخادم: '+(s?.status||'جاهز');}});
  status.textContent='Ron-1 متصل ويعمل بـ Qwen3-1.7B';
}
connect().catch(e=>{status.textContent='تعذر الاتصال بالخادم: '+e.message;});
document.querySelector('form').onsubmit=async e=>{
  e.preventDefault();const s=input.value.trim();if(!s||!app)return;
  add('u',s);input.value='';send.disabled=true;status.textContent='رون يفكر...';
  try{
    const result=await app.predict('/chat',{message:s});
    const value=result?.data?.[0] ?? result?.data ?? '';
    add('r',typeof value==='string'?value:JSON.stringify(value));
    status.textContent='Ron-1 جاهز';
  }catch(err){add('r','حدث خطأ في خادم Ron-1: '+err.message);status.textContent='حدث خطأ';}
  finally{send.disabled=false;input.focus();}
};
</script>
</body></html>
