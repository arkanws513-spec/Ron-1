name: Deploy Ron-1 to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Ron-1
        uses: actions/checkout@v4

      - name: Install Hugging Face Hub
        run: python -m pip install --upgrade huggingface_hub

      - name: Deploy files to existing Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          api.upload_folder(
              repo_id="arkanws513/Ron-1",
              repo_type="space",
              folder_path=".",
              ignore_patterns=[
                  ".git/**",
                  ".github/**",
                  "__pycache__/**",
                  "*.pyc",
                  "data/**",
                  "models/**",
              ],
              commit_message="Deploy Ron-1 Gradio app",
          )
          print("Ron-1 deployed to Hugging Face Space.")
          PY
