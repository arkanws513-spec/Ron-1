name: Remove legacy Qwen release
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DELETE-QWEN-RELEASE to remove the obsolete Qwen weights release
        required: true
        type: string
permissions:
  contents: write
jobs:
  remove-release:
    if: inputs.confirm == 'DELETE-QWEN-RELEASE'
    runs-on: ubuntu-latest
    steps:
      - name: Delete obsolete release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete qwen3-1.7b-weights-v1 --repo "${GITHUB_REPOSITORY}" --yes --cleanup-tag
