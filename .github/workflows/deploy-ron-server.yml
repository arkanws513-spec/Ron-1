name: Keep only Ron-1 on Hugging Face

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-ron-server.yml"
  workflow_dispatch:

jobs:
  cleanup-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Ron-1
        uses: actions/checkout@v4
      - name: Install Hugging Face Hub
        run: python -m pip install --upgrade huggingface_hub
      - name: Delete Hugging Face repositories except Ron-1
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          token = os.environ.get("HF_TOKEN")
          if not token:
              raise SystemExit("HF_TOKEN secret is required; no repositories were deleted.")
          api = HfApi(token=token)
          owner = "arkanws513"
          keep = {
              "arkanws513/Ron-1-server",
              "arkanws513/Ron-1",
          }

          repos = []
          for repo_type, listing in (
              ("space", api.list_spaces(author=owner)),
              ("model", api.list_models(author=owner)),
              ("dataset", api.list_datasets(author=owner)),
          ):
              for item in listing:
                  repo_id = getattr(item, "id", None)
                  if repo_id and repo_id not in keep:
                      repos.append((repo_type, repo_id))

          print(f"Found {len(repos)} Hugging Face repositories to remove.")
          failures = []
          for repo_type, repo_id in repos:
              try:
                  api.delete_repo(repo_id=repo_id, repo_type=repo_type)
                  print(f"DELETED {repo_type}: {repo_id}")
              except Exception as exc:
                  failures.append((repo_type, repo_id, str(exc)))
                  print(f"FAILED {repo_type}: {repo_id}: {type(exc).__name__}: {exc}")

          print("Protected Ron-1 repositories:")
          for repo_id in sorted(keep):
              print(f"KEEP: {repo_id}")

          if failures:
              raise SystemExit(f"{len(failures)} repository deletions failed; see log above.")
          PY
      - name: Ensure Ron-1 Space files are deployed
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          repo = "arkanws513/Ron-1-server"
          try:
              api.restart_space(repo_id=repo)
              print(f"Requested restart for {repo}.")
          except Exception as exc:
              print(f"Restart request did not complete: {type(exc).__name__}: {exc}")
          PY
