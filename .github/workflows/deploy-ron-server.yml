name: Deploy Ron-1 server to Hugging Face ZeroGPU

# Trigger deployment on every push to main and manually.
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Ron-1
        uses: actions/checkout@v4

      - name: Install Hugging Face Hub
        run: python -m pip install --upgrade huggingface_hub

      - name: Prepare Hugging Face Space
        run: |
          rm -rf hf_space
          mkdir -p hf_space
          cp -r app.py requirements.txt core model api hf_space/
          cat > hf_space/README.md <<'EOF'
          ---
          title: Ron-1
          emoji: R
          colorFrom: blue
          colorTo: purple
          sdk: gradio
          app_file: app.py
          pinned: false
          ---
          # Ron-1
          Ron-1 — Qwen3-1.7B local inference server.
          EOF

      - name: Create or update Ron-1 ZeroGPU Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          repo = "arkanws513/Ron-1-server"

          try:
              api.create_repo(
                  repo_id=repo,
                  repo_type="space",
                  private=False,
                  space_sdk="gradio",
                  space_hardware="zerogpu",
                  exist_ok=False,
              )
              print("Created Ron-1-server ZeroGPU Space.")
          except Exception as e:
              print("Space create/update check:", e)

          api.upload_folder(
              repo_id=repo,
              repo_type="space",
              folder_path="hf_space",
              commit_message="Deploy Ron-1 Qwen3-1.7B inference server",
          )
          print("Ron-1-server application uploaded.")
          PY
