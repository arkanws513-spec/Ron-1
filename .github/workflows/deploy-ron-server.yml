name: Deploy Ron-1 server to Hugging Face ZeroGPU

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Ron-1
        uses: actions/checkout@v4

      - name: Install Hugging Face Hub
        run: python -m pip install --upgrade huggingface_hub

      - name: Create or update Ron-1 server Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          repo = "arkanws513/Ron-1-server"

          try:
              api.create_repo(
                  repo_id=repo,
                  repo_type="space",
                  private=False,
                  space_sdk="gradio",
                  space_hardware="zerogpu",
                  exist_ok=False,
              )
              print("Created Ron-1-server ZeroGPU Space.")
          except Exception as e:
              print("Space create:", e)

          api.upload_folder(
              repo_id=repo,
              repo_type="space",
              folder_path=".",
              ignore_patterns=[
                  ".git/**", ".github/**", "__pycache__/**", "*.pyc",
                  "data/**", "models/**", "index.html",
              ],
              commit_message="Deploy Ron-1 Qwen3-1.7B inference server",
          )
          print("Ron-1-server application uploaded.")
          PY
