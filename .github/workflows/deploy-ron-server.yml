name: Deploy Ron-1 to Hugging Face Space

# Run only when explicitly requested. The free Space currently reports an
# account CPU quota error, so automatic restarts on every push cannot fix it.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Ron-1
        uses: actions/checkout@v4

      - name: Install Hugging Face Hub
        run: python -m pip install --upgrade huggingface_hub

      - name: Verify deployment credential
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Add HF_TOKEN in repository Actions secrets before deploying."
            exit 1
          fi

      - name: Prepare Ron-1 Space files
        run: |
          rm -rf hf_space
          mkdir -p hf_space
          cp app.py requirements.txt hf_space/
          cp -r core model hf_space/
          cat > hf_space/README.md <<'EOF'
          ---
          title: Ron-1
          emoji: 🤖
          colorFrom: blue
          colorTo: purple
          sdk: gradio
          sdk_version: 5.49.1
          python_version: "3.10"
          app_file: app.py
          startup_duration_timeout: 1h
          ---
          # Ron-1
          Ron-1 — Qwen3-1.7B local inference assistant.
          EOF

      - name: Upload only Ron-1 files to the existing Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          repo = "arkanws513/Ron-1-server"
          api.upload_folder(
              repo_id=repo,
              repo_type="space",
              folder_path="hf_space",
              commit_message="Deploy Ron-1 files",
          )
          print(f"Uploaded Ron-1 files to {repo}.")
          print("Hugging Face may still refuse to start the Space if the account CPU quota is exhausted.")
          PY
