name: Deploy Ron-1 server to Hugging Face Space

# Optional external deployment: run manually only. Ron Cloud deployment is separate.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Ron-1
        uses: actions/checkout@v4
      - name: Install Hugging Face Hub
        run: python -m pip install --upgrade huggingface_hub
      - name: Prepare Hugging Face Space
        run: |
          rm -rf hf_space
          mkdir -p hf_space
          cp -r app.py requirements.txt core model api hf_space/
          cat > hf_space/README.md <<'EOF'
          ---
          title: Ron-1
          emoji: 🤖
          colorFrom: blue
          colorTo: purple
          sdk: gradio
          app_file: app.py
          pinned: false
          ---
          # Ron-1
          Ron-1 — Qwen3-1.7B local inference server.
          EOF
      - name: Upload Ron-1 to the existing Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          token = os.environ.get("HF_TOKEN")
          if not token:
              raise SystemExit("HF_TOKEN secret is required for this optional Hugging Face deployment.")
          api = HfApi(token=token)
          repo = "arkanws513/Ron-1-server"
          api.upload_folder(
              repo_id=repo,
              repo_type="space",
              folder_path="hf_space",
              commit_message="Deploy Ron-1 to existing Gradio Space",
          )
          print("Ron-1 files uploaded to the existing Hugging Face Space.")
          PY
