name: Ron-1 backend checks

on:
  push:
    branches: [main, ron1-smollm2-runtime]
    paths:
      - "core/**"
      - "tests/**"
      - "Dockerfile"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "core/**"
      - "tests/**"
      - "Dockerfile"
      - ".github/workflows/backend-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: core/requirements.txt
      - name: Install runtime dependencies
        run: python -m pip install -r core/requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q core tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
