name: Ron-1 static checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  check-static-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --input-type=module --check < ron-model-worker.js
      - name: Check required browser app files
        run: test -s index.html && test -s ron-model-worker.js && grep -q 'SmolLM2-135M-Instruct-ONNX' ron-model-worker.js
      - name: Check patch whitespace
        run: git diff --check
