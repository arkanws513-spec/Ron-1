name: Ron-1 CI

on:
  push:
    branches:
      - main
      - 'fix/**'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip fastapi 'pydantic>=2.10.0' 'pytest>=8.0.0' 'httpx>=0.27.0'
      - name: Compile Python modules
        run: python -m compileall -q api core model
      - name: Run tests
        run: python -m pytest -q

  build-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build production Docker image
        run: docker build --pull -t ron-1-ci .
