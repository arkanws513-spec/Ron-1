name: Publish Ron-1 to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: ron1-pages-deploy
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out Ron-1
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare GitHub-hosted runtime assets
        shell: bash
        run: |
          set -euo pipefail
          MODEL_DIR="models/onnx-community/SmolLM2-135M-Instruct-ONNX"
          VENDOR_DIR="vendor/transformers"
          mkdir -p "$MODEL_DIR" "$VENDOR_DIR"

          # Vendor Transformers.js and its ONNX Runtime WASM files only if missing.
          if [ ! -f "$VENDOR_DIR/transformers.min.js" ] || ! compgen -G "$VENDOR_DIR/ort-wasm*" >/dev/null; then
            npm pack @huggingface/transformers@3.7.2 --pack-destination "$RUNNER_TEMP"
            PACKAGE_TGZ="$(find "$RUNNER_TEMP" -maxdepth 1 -name 'huggingface-transformers-3.7.2.tgz' -print -quit)"
            mkdir -p "$RUNNER_TEMP/transformers-package"
            tar -xzf "$PACKAGE_TGZ" -C "$RUNNER_TEMP/transformers-package"
            cp "$RUNNER_TEMP/transformers-package/package/dist/transformers.min.js" "$VENDOR_DIR/"
            find "$RUNNER_TEMP/transformers-package/package/dist" -maxdepth 1 -type f -name 'ort-wasm*' -exec cp {} "$VENDOR_DIR/" \;
          fi

          # Keep model metadata and tokenizer files in this GitHub repository.
          MODEL_BASE="https://huggingface.co/onnx-community/SmolLM2-135M-Instruct-ONNX/resolve/main"
          for file in config.json generation_config.json merges.txt quantize_config.json special_tokens_map.json tokenizer.json tokenizer_config.json vocab.json; do
            if [ ! -s "$MODEL_DIR/$file" ]; then
              curl --fail --location --retry 3 --silent --show-error "$MODEL_BASE/$file" -o "$MODEL_DIR/$file"
            fi
          done

          # Commit the vendored runtime/model metadata so future app runs and deployments
          # do not need npm or Hugging Face at all.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$VENDOR_DIR" "$MODEL_DIR"
          if ! git diff --cached --quiet; then
            git commit -m "Vendor Ron-1 runtime and SmolLM2 metadata for GitHub-only hosting"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

          # Deploy only the static site and its local runtime assets.
          mkdir -p site
          cp index.html ron-model-worker.js site/
          cp -R vendor models site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
