name: Publish Ron-1 to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: ron1-pages-deploy
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out Ron-1
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure low-memory Q4F16 model asset exists in Ron-1 Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="ron1-smollm2-135m-q4-v1"
          ASSET="Ron-1-Smollm2-135M-Instruct-Q4F16.onnx"
          EXPECTED_SHA256="662d0a9d8d5d56e3746a5bf3b3ede96bd2d4d3594d9b2e282baebd4f34cf3589"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "$ASSET"; then
            echo "Q4F16 asset already exists in Ron-1 Release."
          else
            echo "Downloading the smaller official Q4F16 ONNX build during deployment setup (never from the user's browser)."
            curl --fail --location --retry 3 --retry-all-errors \
              "https://huggingface.co/onnx-community/SmolLM2-135M-Instruct-ONNX/resolve/main/onnx/model_q4f16.onnx?download=true" \
              --output "$RUNNER_TEMP/$ASSET"
            echo "$EXPECTED_SHA256  $RUNNER_TEMP/$ASSET" | sha256sum --check -
            gh release upload "$TAG" "$RUNNER_TEMP/$ASSET" --repo "$GITHUB_REPOSITORY"
          fi

      - name: Prepare GitHub-hosted runtime assets
        shell: bash
        run: |
          set -euo pipefail
          MODEL_DIR="models/onnx-community/SmolLM2-135M-Instruct-ONNX"
          VENDOR_DIR="vendor/transformers"
          mkdir -p "$MODEL_DIR" "$VENDOR_DIR"

          # GitHub-only policy: all runtime and model metadata must already be committed here.
          test -s "$VENDOR_DIR/transformers.min.js"
          compgen -G "$VENDOR_DIR/ort-wasm*.wasm" >/dev/null
          for file in config.json generation_config.json merges.txt quantize_config.json special_tokens_map.json tokenizer.json tokenizer_config.json vocab.json; do
            test -s "$MODEL_DIR/$file"
          done

          # Commit the vendored runtime/model metadata so future app runs and deployments
          # do not need npm or Hugging Face at all.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$VENDOR_DIR"
          git add -f "$MODEL_DIR"
          if ! git diff --cached --quiet; then
            git commit -m "Vendor Ron-1 runtime and SmolLM2 metadata for GitHub-only hosting"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

          # Deploy only the static site and its local runtime assets.
          mkdir -p site
          cp index.html ron-model-worker.js site/
          cp -R vendor models site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
