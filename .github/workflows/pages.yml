name: Publish Ron-1 Native Core interface
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ron1-pages-deploy
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out Ron-1
        uses: actions/checkout@v4
      - name: Prepare interface-only site
        run: |
          set -euo pipefail
          mkdir -p site
          cp index.html sw.js site/
          # Deliberately do not bundle SmolLM2, ONNX, Transformers.js, or any model weights.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
